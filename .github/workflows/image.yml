name: image

# Builds the NORI images from the Dockerfile and publishes them on GHCR
# (ghcr.io/lasseufpa/nori). The ns-3 and nr versions are image labels
# (org.nsnam.ns3.version, org.cttc-lena.nr.version), not part of the tag.
#
#   tag             target  published on
#   nori:ci         ci      push to main (Dockerfile or asn/ changed); used by ci.yml
#   nori:dev        dev     push to main (Dockerfile or asn/ changed)
#   nori:X.YY-dev   dev     push of a release tag nori-vX.YY
#
# Pull requests only build the images (nothing is pushed).

on:
  push:
    branches: [main]
    tags: ["nori-v*"]
    paths: ["Dockerfile", "asn/**", ".github/workflows/image.yml"]
  pull_request:
    paths: ["Dockerfile", "asn/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nori

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [ci, dev]
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/nori-v* ]]; then
            version="${GITHUB_REF_NAME#nori-v}"
            if [[ "$TARGET" == dev ]]; then
              tags="$IMAGE:$version-dev"
            else
              tags="$IMAGE:ci-$version"
            fi
          else
            tags="$IMAGE:$TARGET"$'\n'"$IMAGE:$TARGET-$GITHUB_SHA"
          fi
          { echo "list<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=nori-${{ matrix.target }}
          cache-to: type=gha,scope=nori-${{ matrix.target }},mode=max
