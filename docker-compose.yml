services:
  nori-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        UID: 1000
        GID: 1000
    container_name: nori-dev
    volumes:
      - .:/home/developer/ns-3-dev/contrib/nori
    network_mode: "host"
    privileged: true
    tty: true
    stdin_open: true
    environment:
      - TERM=xterm-256color
    working_dir: /home/developer/ns-3-dev
