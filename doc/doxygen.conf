# Doxygen configuration for the NORI API reference.
# Run from the doc/ directory:  doxygen doxygen.conf   (or: make doxygen)

PROJECT_NAME           = "NORI"
PROJECT_NUMBER         = "3.00"
PROJECT_BRIEF          = "O-RAN E2 interface for ns-3 and 5G-LENA"
OUTPUT_DIRECTORY       = build/doxygen
CREATE_SUBDIRS         = NO
OUTPUT_LANGUAGE        = English

INPUT                  = groups.h ../model ../helper ../README.md ../CHANGES.md ../RELEASE_NOTES.md
FILE_PATTERNS          = *.h *.cc *.md
RECURSIVE              = NO
EXCLUDE_PATTERNS       = */e2sim-mod.h
USE_MDFILE_AS_MAINPAGE = ../README.md

EXTRACT_ALL            = YES
EXTRACT_PRIVATE        = NO
EXTRACT_STATIC         = YES
EXTRACT_LOCAL_CLASSES  = NO
HIDE_UNDOC_RELATIONS   = NO
SORT_MEMBER_DOCS       = NO
JAVADOC_AUTOBRIEF      = YES
QT_AUTOBRIEF           = NO
MARKDOWN_SUPPORT       = YES
BUILTIN_STL_SUPPORT    = YES
INLINE_INHERITED_MEMB  = NO

ENABLE_PREPROCESSING   = YES
MACRO_EXPANSION        = YES
EXPAND_ONLY_PREDEF     = YES
PREDEFINED             = NS3_LOG_ENABLE

SOURCE_BROWSER         = YES
REFERENCED_BY_RELATION = YES
REFERENCES_RELATION    = YES
VERBATIM_HEADERS       = NO

GENERATE_HTML          = YES
HTML_OUTPUT            = html
GENERATE_TREEVIEW      = YES
SEARCHENGINE           = YES
GENERATE_LATEX         = NO

HAVE_DOT               = YES
DOT_IMAGE_FORMAT       = svg
CLASS_GRAPH            = YES
COLLABORATION_GRAPH    = NO
INCLUDE_GRAPH          = NO
INCLUDED_BY_GRAPH      = NO

QUIET                  = YES
WARNINGS               = YES
WARN_IF_UNDOCUMENTED   = NO
WARN_LOGFILE           = build/doxygen/warnings.log
